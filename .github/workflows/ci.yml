name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite
        # No API key needed: the suite runs against the mock provider.
        env:
          MAWE_PROVIDER: mock
        run: pytest -v

      - name: Week 2 milestone - M1 pipeline demo
        run: python scripts/m1_demo.py

      - name: Week 3 milestone - PM specs on 5 sample prompts
        run: python scripts/week3_spec_check.py

      - name: Week 4 milestone - generated code actually runs
        run: python scripts/week4_dev_check.py

      - name: CLI smoke test
        run: python -m mawe.cli "Build a terminal snake game" --no-sandbox --db sqlite:///ci-smoke.db
